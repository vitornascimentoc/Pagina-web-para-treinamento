<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu site</title>
  <link rel="stylesheet" href="./assets/css/site.css">
  <script src="./assets/js/index.js" defer></script>
</head>
<body>
  <section class="container">
    <h1>Formulário para Pesquisa</h1>

    <form class="forms">

      <label for="nome-usuario">Seu nome completo:</label>
      <input id="nome-usuario" type="text">

      <label for="time-do-coracao">Seu time do coração:</label>
      <input id="time-do-coracao" type="text">

      <button class="botao" type="submit">Responder</button>
