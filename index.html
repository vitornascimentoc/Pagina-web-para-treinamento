<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu site</title>
  <link rel="stylesheet" href="./assets/css/site.css">
  <script src="./assets/js/index.js" defer></script>
</head>
<body>
  <main class="all">
    <h1>Lista de Tarefas</h1>
    <form class="forms" action="" method="get" autocomplete="off">
      <input id="tarefas-usuario" type="text" placeholder="Crie uma tarefa">

      <div class="comand">
        <button class="botao" type="button">Criar</button>
      </div>
      
      <!-- <div class="comanda">
        <button class="reset" type="submit">resetar</button>
      </div> -->
    </form>
  <section class="board-tasks">
    <div class="taskPen">
      <h2 class="h2Pen">Tarefas Pendentes</h2>
    </div>

    <div class="taskExe">
      <h2 class="h2Exe">Tarefas em Andamento</h2>
    </div>

    <div class="concTask">
      <h2 class="h2Conc">Tarefas Concluídas</h2>
    </div>

    <div class="taskInc">
      <h2 class="h2Inc">Tarefas Incompletas</h2>
    </div>
  </section>
  <!-- <footer class="rodape"></footer> -->
  </main>

</html>
