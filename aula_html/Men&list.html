<!-- Aprendendo a criar menus e listas -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

      nav {
        display: flex;
        margin: 30px;
        height: 40px;
        background: gray;
        align-items: center;
        justify-content: center;
      }

      a {
        color: white;
        text-decoration: none;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background: gray;
        display: block;
        padding: 9px;
        text-transform: uppercase;
      }

      nav a:hover {
        background: rgba(0, 0, 0, 0.2);
      }

      nav ul {
        display: flex;
        list-style: none;
      }

    </style>
</head>
<body>
  <nav>
    <ul>
      <li> <a href="#">Menu</a></li>
      <li><a href="#">Cores</a></li>
      <li><a href="#">contatos</a></li>
    </ul>
  </nav>





  <ul>
    <li>item 1</li>
    <li>item 2</li>
    <li>item 3</li>
  </ul>

  <ol type="I" >
    <li>item 1</li>
    <li>item 2</li>
    <li>item 3</li>
  </ol>
  
  <dl>
    <dt>Café</dt>
    <dd>O café está quente</dd>
  </dl>
</body>
</html>
