<!-- Aula de id e class, ensino a especificar componente a ser modificado -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Página</title>

<style>
  h1 {
    color: white;
    background: black;
  }

  .bold {
    color: azure;
  }
</style>

</head>
  <body>
    <h1 id="1" class="Fundo-preto cor branca">
      Página do <b class="bold">Vitor</b>
    </h1>
    <h1 id="cabecalho-2">
      Texto do <b class="bold">Vitor</b>
    </h1>
  </body>
</html>
